name: CI

on:
  push:
    branches: [main, "claude/**", "v*"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        # 与交付目标一致：Spark（Linux ARM64）、Mac（Apple Silicon），外加常规 x64
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Interface — install, test, build
        run: |
          pnpm --dir web install --frozen-lockfile
          pnpm --dir web test
          pnpm --dir web build
      - name: Fetch bundled runtime libraries (PDF engine)
        run: scripts/fetch-vendor.sh
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - run: cargo build --locked --release -p commonbot-server
