[workspace]
resolver = "2"
members = ["crates/core", "crates/server", "crates/mock-llm", "crates/sign"]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["M&J Group <473276@qq.com>"]
license = "LicenseRef-Proprietary"
publish = false

[workspace.dependencies]
axum = { version = "0.8", features = ["multipart"] }
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

[profile.release]
lto = "thin"
strip = true
